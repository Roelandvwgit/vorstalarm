name: Vorstcontrole

on:
  schedule:
    # GitHub rekent in UTC. Beide tijdzone-periodes staan erin;
    # check.py slaat de regels over die nu niet op 07:00 of 19:00 vallen.
    - cron: "5 5 * * *"
    - cron: "5 6 * * *"
    - cron: "5 17 * * *"
    - cron: "5 18 * * *"
  push:
    branches: [main]
    paths: [config.json]
  workflow_dispatch:
    inputs:
      test:
        description: Alleen een testmelding sturen
        type: boolean
        default: true

concurrency:
  group: vorstcontrole
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Weerbericht controleren
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          SCHEDULE: ${{ github.event.schedule }}
          TEST: ${{ inputs.test }}
        run: python3 check.py

      - name: Status bewaren
        if: always()
        run: |
          git config user.name "vorstalarm"
          git config user.email "vorstalarm@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "Status bijgewerkt"
          git pull --rebase origin main
          git push
